name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

permissions: {}

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: gitcalver/sh@7120f81ed76b73a797dd83e31ef0e74be43affda # v20261007.1
        id: version
        with:
          tag-prefix: v
          tag: 'true'

  publish:
    name: Publish to PyPI
    needs: tag
    runs-on: ubuntu-26.04
    environment:
      # PyPI's trusted publisher is bound to this workflow file and environment.
      name: pypi
      url: https://pypi.org/p/gitcalver
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv build
      - name: Verify distribution filenames
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          [[ -f "dist/gitcalver-$VERSION-py3-none-any.whl" ]]
          [[ -f "dist/gitcalver-$VERSION.tar.gz" ]]
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
