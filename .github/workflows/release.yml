name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

permissions: {}

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: gitcalver/sh@857287da052d1437703ead1f7d2adc76a95451ba # v20260825.1
        id: version
        with:
          tag-prefix: v
          tag: 'true'

  publish:
    name: Publish to PyPI
    needs: tag
    runs-on: ubuntu-26.04
    environment:
      # PyPI's trusted publisher is bound to this workflow file and environment.
      name: pypi
      url: https://pypi.org/p/gitcalver
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv build
      - name: Verify distribution filenames
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          [[ -f "dist/gitcalver-$VERSION-py3-none-any.whl" ]]
          [[ -f "dist/gitcalver-$VERSION.tar.gz" ]]
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
