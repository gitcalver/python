name: Release

on:
  workflow_run:
    # zizmor: ignore[dangerous-triggers] Only successful pushes from this repository can publish releases.
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write # Creates release tags for the tested commit.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked] Release tags use the checkout credential.
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: true
      - uses: gitcalver/sh@v20261128.2
        id: version
        with:
          tag-prefix: v
          tag: "true"
    name: tag

  publish:
    name: Publish to PyPI
    needs: tag
    runs-on: ubuntu-26.04
    environment:
      # PyPI's trusted publisher is bound to this workflow file and environment.
      name: pypi
      url: https://pypi.org/p/gitcalver
    permissions:
      actions: read # Downloads distributions from the successful CI run.
      id-token: write # Authenticates to PyPI through trusted publishing.
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-distribution
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify distribution filenames
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          [[ -f "dist/gitcalver-$VERSION-py3-none-any.whl" ]]
          [[ -f "dist/gitcalver-$VERSION.tar.gz" ]]
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true
