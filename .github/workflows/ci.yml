name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
      - run: uv python install "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
      - run: make test
        env:
          UV_PYTHON: ${{ matrix.python-version }}
    name: test (${{ matrix.python-version }})

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: make actions-lock-install
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make lint
    name: lint

  conformance:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        object-format: [sha1, sha256]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: gitcalver/sh
          ref: 7120f81ed76b73a797dd83e31ef0e74be43affda # v20261007.1
          path: conformance-sh
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.object-format }}
      - run: uv python install 3.14
      - run: make test-conformance CONFORMANCE_DIR=conformance-sh
        env:
          GIT_DEFAULT_HASH: ${{ matrix.object-format }}
    name: conformance (${{ matrix.object-format }})

  build:
    name: Build distribution
    needs: [test, lint, conformance]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.14
      - uses: gitcalver/sh@v20261007.1
        id: version
        with:
          dirty: +dirty
      - name: Verify Python calculation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(uv run python -m gitcalver --dirty +dirty)
          [[ $actual == "$VERSION" ]]
      - run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
