name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: make test
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: make lint

  conformance:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        object-format: [sha1, sha256]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gitcalver/sh
          ref: 857287da052d1437703ead1f7d2adc76a95451ba # v20260825.1
          path: conformance-sh
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.object-format }}
      - run: uv python install 3.14
      - run: make test-conformance CONFORMANCE_DIR=conformance-sh
        env:
          GIT_DEFAULT_HASH: ${{ matrix.object-format }}

  build:
    name: Build distribution
    needs: [test, lint, conformance]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - uses: gitcalver/sh@857287da052d1437703ead1f7d2adc76a95451ba # v20260825.1
        id: version
        with:
          dirty: +dirty
      - name: Verify Python calculation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual=$(uv run python -m gitcalver --dirty +dirty)
          [[ $actual == "$VERSION" ]]
      - run: uv build
